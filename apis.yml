name: Finda
description: >-
  Finda (핀다) is a South Korean fintech company founded in 2015 and headquartered
  in Seoul that operates a licensed online loan-comparison and financial-product
  marketplace. Through its mobile app and website, Finda lets consumers compare
  loan products from 76+ financial institutions and 400+ products in about a
  minute, refinance existing loans ("갈아타기"), aggregate accounts and cards for
  asset management, run financial calculators (interest, DSR, year-end tax,
  mortgage eligibility), and monitor and manage their credit. Registered as a
  loan-brokerage/loan-collection corporation under Korea's Financial Services
  Act, Finda earns commissions from partner financial institutions rather than
  charging consumers. It reports 3.47M+ cumulative members and 256T+ won in
  managed loan assets, and is backed by 500 Global. Finda is a consumer B2C
  platform and does not publish a public developer API.
